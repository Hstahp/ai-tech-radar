# =============================================================================
# AI TECH RADAR — Pipeline hằng ngày
# Đặt file này tại: .github/workflows/daily-pipeline.yml
#
# Luồng: tải DB từ GitHub Release → chạy pipeline → kiểm tra toàn vẹn
#        → upload DB lại → commit JSON export → (Cloudflare/GitHub Pages tự build)
#
# Yêu cầu trong repo:
#   - package.json (gốc) có pnpm workspace; app pipeline tên "@radar/pipeline" với các script:
#       db:migrate  : áp dụng db/schema.sql + migration còn thiếu vào --db
#       run         : chạy toàn bộ pipeline (fetch → score → summarize → export)
#       db:check    : PRAGMA integrity_check + foreign_key_check, thoát mã ≠ 0 nếu lỗi
#       db:maintain : dọn dữ liệu cũ (xem phần ghi chú cuối schema.sql)
#   - .gitignore chứa:  data/radar.db*
#
# Secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY        (bắt buộc nếu dùng Gemini)
#   GROQ_API_KEY          (tùy chọn, dùng làm fallback)
#   DISCORD_WEBHOOK_URL   (tùy chọn, gửi điểm tin lên Discord)
#   TELEGRAM_BOT_TOKEN    (tùy chọn, để nhận cảnh báo lỗi)
#   TELEGRAM_CHAT_ID      (tùy chọn)
# Variables (tùy chọn):
#   LLM_PRIMARY_MODEL     tên model chính, vd đặt theo model Flash/Flash-Lite hiện hành
#   LLM_FALLBACK_MODEL    tên model dự phòng
#
# Lưu ý:
#   - cron của GitHub chạy theo UTC và có thể trễ vài phút đến hàng chục phút khi tải cao.
#   - Workflow theo lịch có thể bị tắt nếu repo không có hoạt động trong thời gian dài;
#     thỉnh thoảng vào tab Actions kiểm tra.
# =============================================================================

name: Daily AI Tech Radar

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 07:00 giờ Việt Nam
    # - cron: "0 12 * * *"   # bỏ comment nếu muốn chạy lần 2 lúc 19:00 giờ VN
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chạy thử: không upload DB, không commit"
        type: boolean
        default: false
      skip_llm:
        description: "Bỏ qua bước gọi LLM (chỉ fetch + lọc + chấm điểm)"
        type: boolean
        default: false

permissions:
  contents: write            # commit export + tạo/ghi Release asset

concurrency:
  group: radar-pipeline      # không cho hai lần chạy đè nhau (tránh ghi đè DB)
  cancel-in-progress: false

env:
  TZ: Asia/Ho_Chi_Minh
  DB_FILE: data/radar.db
  DB_RELEASE_TAG: data-latest
  EXPORT_DIR: data/export
  NODE_VERSION: "22"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # 1) Lấy DB từ GitHub Release (tạo release rỗng nếu là lần chạy đầu)
      # ---------------------------------------------------------------------
      - name: Đảm bảo Release chứa DB tồn tại
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DB_RELEASE_TAG" \
              --title "Radar database (auto-updated)" \
              --notes "File radar.db được pipeline tự động cập nhật. Không chỉnh tay."
          fi

      - name: Tải DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data "$EXPORT_DIR"
          gh release download "$DB_RELEASE_TAG" --pattern "radar.db" --dir data --clobber || \
            echo "Chưa có radar.db trong release, sẽ tạo mới."

      - name: Khởi tạo / migrate DB
        run: pnpm --filter @radar/pipeline run db:migrate -- --db "$DB_FILE"

      - name: Sao lưu DB trước khi chạy (rollback 1 ngày)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$DB_FILE" data/radar-prev.db
          gh release upload "$DB_RELEASE_TAG" data/radar-prev.db --clobber

      # ---------------------------------------------------------------------
      # 2) Chạy pipeline
      # ---------------------------------------------------------------------
      - name: Chạy pipeline
        env:
          GITHUB_API_TOKEN: ${{ github.token }}        # tăng giới hạn GitHub API
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_PRIMARY_MODEL: ${{ vars.LLM_PRIMARY_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SKIP_LLM: ${{ inputs.skip_llm && 'true' || 'false' }}
        run: |
          ARGS="--db $DB_FILE --export $EXPORT_DIR"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$SKIP_LLM" = "true" ]; then ARGS="$ARGS --skip-llm"; fi
          pnpm --filter @radar/pipeline run run -- $ARGS

      - name: Dọn dữ liệu cũ (chỉ chủ nhật)
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$(date +%u)" = "7" ]; then
            pnpm --filter @radar/pipeline run db:maintain -- --db "$DB_FILE"
          fi

      - name: Kiểm tra toàn vẹn DB
        run: pnpm --filter @radar/pipeline run db:check -- --db "$DB_FILE"

      # ---------------------------------------------------------------------
      # 3) Lưu kết quả (bỏ qua khi dry-run)
      # ---------------------------------------------------------------------
      - name: Upload DB lên Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$DB_RELEASE_TAG" "$DB_FILE" --clobber

      - name: Commit bản export (JSON/RSS)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EXPORT_DIR"
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
          else
            git commit -m "chore(data): digest $(date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ---------------------------------------------------------------------
      # 4) Khi lỗi: lưu log + báo Telegram
      # ---------------------------------------------------------------------
      - name: Lưu log khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            data/logs/
            data/export/
          retention-days: 7
          if-no-files-found: ignore

      - name: Báo lỗi qua Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=⚠️ AI Tech Radar: pipeline lỗi ngày $(date +%F). Xem log: ${RUN_URL}" \
              >/dev/null
          else
            echo "Chưa cấu hình Telegram, bỏ qua."
          fi
